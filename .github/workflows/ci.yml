name: Build and Test

on:
  push:
    branches:
      - feat/model-arena-redteam
  pull_request:
    branches:
      - feat/model-arena-redteam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build/check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Evaluation runner smoke test
        run: EVAL_LIMIT=5 EVAL_MODELS=mini,maxRed node eval/runner.mjs
      - name: Upload evaluation smoke results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-smoke-results
          path: |
            eval/results.jsonl
            eval/summary.json
