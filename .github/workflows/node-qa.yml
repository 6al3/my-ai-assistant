name: DIG Node QA

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'api/**'
      - 'box/**'
      - 'memory/**'
      - 'security/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/node-qa.yml'
  push:
    branches:
      - 'dig/mission-queue-durable-state'
    paths:
      - 'agents/**'
      - 'api/**'
      - 'box/**'
      - 'memory/**'
      - 'security/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/node-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dig-node-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run syntax checks
        run: npm run check

  test-suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: queue-core
            tests: >-
              box/project-files.test.mjs
              api/missions-core.test.mjs
              agents/mission-queue.test.mjs
              agents/mission-queue-store.test.mjs
              agents/mission-coordinator.test.mjs
          - name: worker-reliability
            tests: >-
              agents/worker-runtime.test.mjs
              agents/worker-transport-envelope.test.mjs
              agents/durable-request-journal.test.mjs
              agents/worker-lease-fencing.test.mjs
              agents/orchestrated-mission-runtime.test.mjs
          - name: distributed-faults
            tests: >-
              agents/orchestration-benchmark.test.mjs
              agents/orchestration-process-fault.test.mjs
              agents/orchestration-authenticated-recovery.test.mjs
              agents/qrexec-response-attestation.test.mjs
              agents/qubes-qrexec-coordinator-service.test.mjs
              agents/qrexec-fault-readonly-preflight.test.mjs
              agents/qubes-qrexec-readiness-gate.test.mjs
              agents/qubes-qrexec-campaign-collector.test.mjs
              agents/qubes-qrexec-campaign-harness.test.mjs
              agents/qubes-qrexec-qa-join-evidence.test.mjs
              agents/qubes-real-worker-evidence-gate.test.mjs
              agents/qubes-multi-run-qualification.test.mjs
              agents/qubes-qrexec-qualification-preflight.test.mjs
              agents/qubes-qrexec-qualification-runner.test.mjs
          - name: synthetic-sandboxes
            tests: >-
              agents/benchmark-arena.test.mjs
              agents/payment-sandbox.test.mjs
              agents/collaboration-sandbox.test.mjs
              ios/DIGAssistant/mission-control-plane-contract.test.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run ${{ matrix.name }}
        if: matrix.name != 'distributed-faults'
        run: node --test ${{ matrix.tests }}
      - name: Run distributed-faults with file diagnostics
        if: matrix.name == 'distributed-faults'
        shell: bash
        run: |
          set +e
          failed=0
          for test_file in ${{ matrix.tests }}; do
            echo "::group::${test_file}"
            node --test "$test_file"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error file=${test_file}::DIG distributed-fault test failed: ${test_file} (exit ${status})"
              failed=1
            fi
          done
          exit "$failed"
