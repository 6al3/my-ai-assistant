<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
</head>

<body>
  <h1>My AI Assistant</h1>

  <input
    id="message"
    type="text"
    placeholder="اكتب رسالتك هنا..."
    autocomplete="off"
  >

  <button id="sendButton" onclick="sendMessage()">إرسال</button>

  <div id="status"></div>
  <pre id="response"></pre>

  <script>
    const messageInput = document.getElementById("message");
    const responseBox = document.getElementById("response");
    const statusBox = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");

    async function sendMessage() {
      const message = messageInput.value.trim();

      if (!message) return;

      sendButton.disabled = true;
      statusBox.textContent = "جاري الاتصال...";
      responseBox.textContent = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ في الخادم");
        }

        statusBox.textContent = "تم الرد";
        responseBox.textContent = data.reply || "ما وصل رد من الذكاء الاصطناعي.";
      } catch (error) {
        statusBox.textContent = "فشل الطلب";
        responseBox.textContent = "خطأ: " + error.message;
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
