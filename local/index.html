<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DIG Agent Room</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0d10;color:#f5f7fa}
    *{box-sizing:border-box} body{margin:0;background:#0b0d10} .app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}
    header{display:flex;align-items:center;gap:10px;padding:8px 0}.dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80}.muted{color:#9ca3af;font-size:13px}.spacer{flex:1}
    select,textarea,button{font:inherit} select,textarea{background:#14181f;color:#fff;border:1px solid #2a3039;border-radius:12px;padding:12px} select{min-width:160px} button{border:0;border-radius:12px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700} button.secondary{background:#20252d;color:#d1d5db} button:disabled{opacity:.5}
    #messages{flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:6px 0 110px}.msg{padding:12px 14px;border:1px solid #242a33;border-radius:16px;background:#12161c;white-space:pre-wrap;line-height:1.55}.msg.user{background:#172554;border-color:#243b76}.who{font-size:12px;color:#9ca3af;margin-bottom:5px;font-weight:700}
    .composer{position:sticky;bottom:0;background:linear-gradient(transparent,#0b0d10 18%);padding-top:24px}.row{display:flex;gap:8px;align-items:flex-end} textarea{flex:1;min-height:54px;max-height:180px;resize:vertical}
    .status{font-size:12px;color:#9ca3af;padding-inline:4px}.badge{border:1px solid #2a3039;border-radius:999px;padding:5px 9px;font-size:12px;color:#cbd5e1}
  </style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot"></span><strong>DIG Agent Room</strong>
    <span class="badge">LOCAL ONLY</span><span class="badge">QUBES OFF</span>
    <span class="spacer"></span><button class="secondary" id="clear">مسح</button>
  </header>
  <div class="row">
    <select id="agent">
      <option value="coder">Coder</option>
      <option value="system">System</option>
      <option value="qa">QA</option>
      <option value="team">الثلاثة مع بعض</option>
    </select>
    <span class="muted" id="health">جاري فحص النموذج المحلي…</span>
  </div>
  <main id="messages"></main>
  <div class="composer">
    <div class="status" id="status">المحادثة محفوظة محليًا في هذا المتصفح فقط.</div>
    <div class="row">
      <textarea id="input" placeholder="اكتب لهم هنا…"></textarea>
      <button id="send">إرسال</button>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const key='dig-local-agent-room-v1';
let history=[];
try{history=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
function save(){localStorage.setItem(key,JSON.stringify(history.slice(-100)))}
function add(role,content,who){const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'');const w=document.createElement('div');w.className='who';w.textContent=who||role;const c=document.createElement('div');c.textContent=content;el.append(w,c);$('messages').append(el);el.scrollIntoView({behavior:'smooth',block:'end'})}
function render(){ $('messages').innerHTML=''; for(const x of history)add(x.role,x.content,x.who) }
render();
async function health(){try{const r=await fetch('/api/health');const d=await r.json();$('health').textContent=`جاهز — ${d.model}`;}catch{$('health').textContent='النموذج المحلي غير متصل';}}
health();
$('clear').onclick=()=>{history=[];save();render()};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('send').onclick=send;
async function send(){const text=$('input').value.trim();if(!text)return;$('input').value='';history.push({role:'user',content:text,who:'أنت'});save();render();$('send').disabled=true;$('status').textContent='يفكرون محليًا…';
try{const payload={message:text,agent:$('agent').value,history:history.map(x=>({role:x.role,content:x.content}))};const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'request failed');
if(Array.isArray(d.replies)){for(const x of d.replies)history.push({role:'assistant',content:x.reply,who:x.name})}else{history.push({role:'assistant',content:d.reply,who:d.name||'DIG'})}save();render();$('status').textContent='محلي فقط — لا Qubes ولا API cloud.';
}catch(e){history.push({role:'assistant',content:'تعذر الوصول للنموذج المحلي. تأكد أن Ollama شغال وأن الموديل مثبت.',who:'System'});save();render();$('status').textContent=String(e.message||e)}finally{$('send').disabled=false}}
</script>
</body>
</html>
