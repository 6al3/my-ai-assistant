name: DIGAssistant
options:
  bundleIdPrefix: com.digassistant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DIGAssistant:
    type: application
    platform: iOS
    sources:
      - path: DIGAssistant
    info:
      path: DIGAssistant/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digassistant.app
        PRODUCT_NAME: DIGAssistant
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
